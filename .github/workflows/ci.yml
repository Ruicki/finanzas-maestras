name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Valores dummy solo para que Prisma pueda parsear el schema (no se conecta a una DB real).
  POSTGRES_PRISMA_URL: "postgresql://user:pass@localhost:5432/db"
  POSTGRES_URL_NON_POOLING: "postgresql://user:pass@localhost:5432/db"
  JWT_SECRET: "ci-placeholder-secret-only-for-typecheck-not-real-32chars"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
